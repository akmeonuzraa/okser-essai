<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <rect width="600" height="320" fill="#3a6a3a"/>
  <!-- Hedge trimming -->
  <g transform="translate(200,80)">
    <!-- Hedge -->
    <rect x="0" y="80" width="200" height="60" rx="10" fill="#2a5a2a"/>
    <rect x="0" y="70" width="200" height="20" rx="8" fill="#3a6a3a"/>
    <!-- Trimmer -->
    <rect x="50" y="50" width="80" height="12" rx="3" fill="#666"/>
    <rect x="45" y="48" width="90" height="4" fill="#888"/>
  </g>
</svg>
