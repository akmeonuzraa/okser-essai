<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0a0a"/>
  <!-- Security agent silhouette -->
  <g transform="translate(350,50)" opacity="0.5">
    <rect x="30" y="0" width="80" height="120" rx="4" fill="#1a1a1a"/>
    <circle cx="70" cy="25" r="18" fill="#222"/>
    <rect x="50" y="45" width="40" height="60" fill="#222"/>
    <!-- SECURITY text -->
    <rect x="45" y="80" width="50" height="16" fill="#A0000C"/>
    <text x="70" y="92" font-family="Roboto, Arial" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">SECURITY</text>
  </g>
  <!-- Red bar -->
  <rect x="20" y="30" width="200" height="30" fill="#A0000C"/>
  <text x="30" y="50" font-family="Roboto, Arial" font-size="13" fill="#fff" font-weight="500">Gardiennage et Surveillance</text>
</svg>
