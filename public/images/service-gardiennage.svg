<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a4a6a"/>
      <stop offset="100%" stop-color="#1a3a5a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="170" fill="url(#bg1)"/>
  <!-- Security agent -->
  <g transform="translate(120,20)">
    <circle cx="80" cy="30" r="22" fill="#333"/>
    <rect x="55" y="55" width="50" height="75" rx="4" fill="#2a2a2a"/>
    <rect x="45" y="85" width="70" height="18" fill="#A0000C"/>
    <text x="80" y="98" font-family="Roboto, Arial" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">SECURITY</text>
    <!-- Badge -->
    <circle cx="105" cy="65" r="6" fill="#666"/>
  </g>
  <!-- World map dots in background -->
  <g opacity="0.15" fill="#fff">
    <circle cx="50" cy="60" r="1.5"/><circle cx="60" cy="55" r="1.5"/><circle cx="70" cy="65" r="1.5"/>
    <circle cx="40" cy="70" r="1.5"/><circle cx="55" cy="75" r="1.5"/><circle cx="65" cy="80" r="1.5"/>
  </g>
</svg>
