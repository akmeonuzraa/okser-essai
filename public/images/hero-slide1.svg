<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0a0a"/>
  <!-- Mosaic of cleaning/gardening icons -->
  <rect x="300" y="20" width="130" height="110" fill="#1a1a1a" rx="4"/>
  <rect x="450" y="20" width="130" height="110" fill="#1a1a1a" rx="4"/>
  <rect x="300" y="150" width="130" height="110" fill="#1a1a1a" rx="4"/>
  <rect x="450" y="150" width="130" height="110" fill="#1a1a1a" rx="4"/>
  <!-- Broom icon -->
  <g transform="translate(340,45)"><rect x="-2" y="0" width="4" height="40" fill="#444"/><polygon points="-12,40 12,40 8,55 -8,55" fill="#666"/></g>
  <!-- Plant icon -->
  <g transform="translate(510,45)"><rect x="-2" y="20" width="4" height="30" fill="#3a5a2a"/><ellipse cx="-8" cy="15" rx="10" ry="8" fill="#2a4a1a"/><ellipse cx="8" cy="10" rx="10" ry="8" fill="#2a4a1a"/></g>
  <!-- Spray bottle -->
  <g transform="translate(340,175)"><rect x="-8" y="0" width="16" height="35" fill="#333" rx="2"/><rect x="-4" y="-8" width="8" height="10" fill="#444"/></g>
  <!-- Rat silhouette -->
  <g transform="translate(510,185)"><ellipse cx="0" cy="10" rx="18" ry="10" fill="#444"/><circle cx="-14" cy="6" r="5" fill="#444"/><path d="M-18,2 L-22,-2 M-14,2 L-12,-3" stroke="#444" stroke-width="1.5"/></g>
  <!-- Left side text area -->
  <rect x="20" y="60" width="250" height="3" fill="#A0000C"/>
  <text x="20" y="90" font-family="Roboto, Arial" font-size="16" fill="#fff" font-weight="400">Nettoyage industriel</text>
  <text x="20" y="115" font-family="Roboto, Arial" font-size="16" fill="#fff" font-weight="400">Jardinage</text>
  <text x="20" y="140" font-family="Roboto, Arial" font-size="16" fill="#fff" font-weight="400">Dératisation...</text>
</svg>
