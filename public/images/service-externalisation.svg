<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170">
  <rect width="400" height="170" fill="#3a5a4a"/>
  <!-- Handshake -->
  <g transform="translate(100,50)">
    <!-- Left arm -->
    <rect x="0" y="25" width="60" height="20" rx="4" fill="#8a6a4a"/>
    <!-- Right arm -->
    <rect x="140" y="25" width="60" height="20" rx="4" fill="#7a5a4a"/>
    <!-- Hands clasped -->
    <ellipse cx="100" cy="35" rx="30" ry="15" fill="#9a7a5a"/>
    <rect x="80" y="28" width="40" height="14" rx="6" fill="#8a6a4a"/>
    <rect x="85" y="26" width="30" height="5" rx="2" fill="#a88a6a"/>
  </g>
</svg>
