<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170">
  <rect width="400" height="170" fill="#2a3a5a"/>
  <!-- Keyboard -->
  <g transform="translate(80,40)">
    <rect x="0" y="0" width="240" height="90" rx="4" fill="#3a4a6a"/>
    <rect x="10" y="10" width="220" height="25" rx="2" fill="#4a5a7a"/>
    <g fill="#5a6a8a">
      <rect x="15" y="45" width="20" height="18" rx="2"/>
      <rect x="40" y="45" width="20" height="18" rx="2"/>
      <rect x="65" y="45" width="20" height="18" rx="2"/>
      <rect x="90" y="45" width="20" height="18" rx="2"/>
      <rect x="115" y="45" width="20" height="18" rx="2"/>
      <rect x="140" y="45" width="20" height="18" rx="2"/>
      <rect x="165" y="45" width="20" height="18" rx="2"/>
      <rect x="190" y="45" width="20" height="18" rx="2"/>
      <rect x="15" y="67" width="20" height="18" rx="2"/>
      <rect x="40" y="67" width="20" height="18" rx="2"/>
    </g>
    <!-- Blue "Recrutement" key -->
    <rect x="65" y="67" width="80" height="18" rx="2" fill="#3A7AB8"/>
    <text x="105" y="80" font-family="Roboto, Arial" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">Recrutement</text>
  </g>
</svg>
